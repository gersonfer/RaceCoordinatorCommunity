<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>RC Audio Player</title>
  <style>
    body {
      font-family: sans-serif;
      background: #121212;
      color: white;
      padding: 20px;
    }

    details {
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 5px;
      background: #1e1e1e;
      padding: 10px;
    }

    summary {
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      color: #ddd;
    }

    .video-button {
      background: #2a2a2a;
      color: white;
      border: none;
      padding: 8px 14px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .video-button:hover {
      background: #444;
    }

    iframe {
      width: 560px;
      height: 315px;
      border: none;
      margin-top: 20px;
    }

    #errorMessage {
      background: #900;
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Reprodutor de Áudios - RC Audio</h1>

  <div id="content"></div>
  <div id="playerContainer"></div>
  <div id="errorMessage">❌ Erro ao carregar vídeos. Use um servidor web como <code>http://localhost</code> para abrir esta página.</div>

  <script>
    async function carregarVideos() {
      try {
        const response = await fetch('videos_index.json');
        if (!response.ok) throw new Error('Erro no fetch');

        const lista = await response.json();
        const agrupado = {};

        // ✅ AGRUPAMENTO CORRIGIDO
        lista.forEach(video => {
          const pasta = video.pasta || 'geral';
          if (!agrupado[pasta]) {
            agrupado[pasta] = [];
          }
          agrupado[pasta].push(video);
        });

        const content = document.getElementById('content');
        const player = document.getElementById('playerContainer');

        for (const pasta in agrupado) {
          const section = document.createElement('details');
          section.open = false;

          const summary = document.createElement('summary');
          summary.textContent = `/${pasta}`;
          section.appendChild(summary);

          agrupado[pasta].forEach(video => {
            const btn = document.createElement('button');
            btn.className = 'video-button';
            btn.textContent = video.nome;
            btn.onclick = () => {
              player.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${video.video_id}?autoplay=1"
                        allow="autoplay; encrypted-media"
                        allowfullscreen></iframe>
              `;
            };
            section.appendChild(btn);
          });

          content.appendChild(section);
        }

      } catch (err) {
        document.getElementById('errorMessage').style.display = 'block';
        console.error('Erro ao carregar JSON:', err);
      }
    }

    carregarVideos();
  </script>

</body>
</html>
