<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Segment Times Viewer</title>
  <link rel="stylesheet" href="style/segment-times.css" />
</head>
<body>
  <div class="container">
    <h1>Segment Times</h1>
    <div id="status">Loading data...</div>
    <table id="segment-table">
      <thead>
        <tr>
          <th>Driver</th>
          <th>Lap</th>
          <th>Lap Time</th>
          <th>Segment 1</th>
          <th>Segment 2</th>
          <th>Segment 3</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="scripts/segment-times.js"></script>
</body>
</html>
